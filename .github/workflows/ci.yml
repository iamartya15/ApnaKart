name: ApnaKart CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Check Formatting
        run: npx prettier --check .

      - name: Security Scan
        run: npm audit --audit-level=high || true

  test-and-build:
    runs-on: ubuntu-latest
    needs: lint-and-format
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Build
        run: npm run build

      - name: Run Test Suite
        run: npx ts-node --transpile-only backend/src/tests/run-tests.ts

  docker-build-verification:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false

      - name: Verify Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false

      - name: Verify Admin Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: false

  deployment-trigger:
    runs-on: ubuntu-latest
    needs: docker-build-verification
    steps:
      - name: Simulate Production Deployment
        run: |
          echo "Triggering cloud deployment updates..."
          echo "Vercel Frontend: SUCCESS"
          echo "Railway Backend: SUCCESS"
          echo "Kubernetes Rolling Update: SUCCESS"
