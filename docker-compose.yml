version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: apnakart_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    networks:
      - apnakart_net
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7.0-alpine
    container_name: apnakart_redis
    ports:
      - '6379:6379'
    networks:
      - apnakart_net
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apnakart_backend
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/apnakart
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=production
    ports:
      - '5000:5000'
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apnakart_net
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:5000/api/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apnakart_frontend
    ports:
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - apnakart_net
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:80/index.html"]
      interval: 15s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: apnakart_admin
    ports:
      - '3001:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - apnakart_net
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:80/index.html"]
      interval: 15s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: apnakart_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      admin:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - apnakart_net
    restart: always

networks:
  apnakart_net:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
