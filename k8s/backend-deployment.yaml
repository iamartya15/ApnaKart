apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: apnakart/backend:latest
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: apnakart-config
          resources:
            limits:
              cpu: "1"
              memory: 1.5Gi
            requests:
              cpu: "500m"
              memory: 750Mi
          livenessProbe:
            httpGet:
              path: /api/liveness
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/readiness
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
spec:
  maxReplicas: 10
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  targetCPUUtilizationPercentage: 75
